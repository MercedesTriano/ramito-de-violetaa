<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramito de Violeta - Mercedes Triano Blanco</title>
    <style>
        /* Importar fuente moderna tipo Pull&Bear */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap');

        /* Estilos generales limpios */
        body {
            background-color: #f7f7f7; /* Fondo gris muy claro */
            color: #111111;            /* Texto casi negro de alta legibilidad */
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Contenedor tipo tarjeta minimalista */
        .container {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Tipografías de estilo urbano */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        h2 {
            font-size: 1rem;
            font-weight: 400;
            color: #666666;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p {
            font-size: 0.95rem;
            color: #444444;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Contenedor responsivo para el reproductor de vídeo */
        .video-container {
            margin-top: 20px;
            position: relative;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 4px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡Hola, mundo!</h1>
        <h2>Mercedes Triano Blanco</h2>
        <p>Este es el contenido principal de mi página web Ramito de Violeta.</p>

        <!-- Vídeo de YouTube incrustado -->
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/TTzrFxeBiUQ" 
                title="Manzanita - Un Ramito de Violetas" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
